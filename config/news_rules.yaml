# News and corporate announcement classification rules
# Deterministic keyword patterns for Indian and US disclosures

severity_rules:
  RED:
    description: "Critical risk events: block entry and immediate alert if position is held"
    keywords:
      - "fraud"
      - "forensic audit"
      - "sebi order"
      - "sebi penalty"
      - "regulatory action"
      - "auditor resignation"
      - "resignation of statutory auditor"
      - "resignation of auditor"
      - "cfo resignation"
      - "ceo resignation"
      - "sudden resignation"
      - "default"
      - "debt default"
      - "insolvency"
      - "nclt"
      - "cirp"
      - "downgrade"
      - "rating downgrade"
      - "credit rating downgraded"
      - "suspension of trading"
      - "promoter pledge"
      - "invocation of pledge"
      - "block deal sell-down"
      - "promoter stake sale"
      - "sec investigation"
      - "subpoena"
      - "class action"
      - "restatement of financials"
      - "material weakness"

  AMBER:
    description: "Notable corporate developments: flag for manual review, do not block"
    keywords:
      - "fund raise"
      - "qualified institutional placement"
      - "qip"
      - "preferential issue"
      - "rights issue"
      - "board meeting for financial results"
      - "board meeting for results"
      - "financial results"
      - "key managerial personnel"
      - "appointment of"
      - "resignation of independent director"
      - "litigation"
      - "dispute"
      - "tax demand"
      - "show cause notice"
      - "merger"
      - "acquisition"
      - "demerger"
      - "scheme of arrangement"

  GREEN:
    description: "Positive operational developments: informational"
    keywords:
      - "order win"
      - "contract award"
      - "bagged order"
      - "new order"
      - "expansion"
      - "capacity expansion"
      - "commissioning"
      - "buyback"
      - "share buyback"
      - "dividend"
      - "interim dividend"
      - "credit rating upgrade"
      - "rating upgraded"
      - "fda approval"
      - "patent granted"
      - "usfda"

