name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed credentials
        shell: bash
        run: |
          set -euo pipefail
          # Telegram bot token shape; documented placeholder values are intentionally excluded.
          if git grep -nE '[0-9]{8,12}:[A-Za-z0-9_-]{25,}' -- ':!package-lock.json' ':!frontend/package-lock.json'; then
            echo 'Potential Telegram bot token found. Revoke it and remove it from the repository.' >&2
            exit 1
          fi
          if git grep -nE '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.lock'; then
            echo 'Private key material found in repository.' >&2
            exit 1
          fi
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
