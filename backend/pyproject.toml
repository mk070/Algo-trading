[project]
name = "swing-platform-backend"
version = "0.1.0"
description = "Swing Trading Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "yfinance>=0.2.37",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
    "logzero>=1.7.0",
    "websocket-client>=1.7.0",
    "requests>=2.31.0",
    "curl_cffi>=0.7.0",
    "smartapi-python>=1.4.8",
    "tenacity>=8.2.3",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
