services:
  - type: web
    name: algo-trading-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv pip install --python .venv/bin/python -r backend/pyproject.toml
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend --timeout-graceful-shutdown 15
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: production
      - key: APP_TOKEN
        generateValue: true
      - key: PORT
        value: 10000

  - type: cron
    name: algo-paper-daily
    env: python
    region: oregon
    plan: free
    schedule: "30 10 * * 1-5"  # 16:00 IST (UTC 10:30) Mon-Fri
    buildCommand: pip install uv && uv pip install --python .venv/bin/python -r backend/pyproject.toml
    startCommand: python -c "import sys; sys.path.insert(0, 'backend'); from app.scheduler.jobs import run_paper_evaluation_once; run_paper_evaluation_once()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: production
      - key: FORWARD_PAPER_TRADING_ENABLED
        value: false

