services:
  - type: web
    name: algo-trading-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv pip install --python .venv/bin/python -r backend/pyproject.toml
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
